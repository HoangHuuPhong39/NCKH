name: CI & Security Quality Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Security_Scanner
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: AI_Security_Scanner/requirements.txt

      - name: Install Core & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install scikit-learn

      - name: Full Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q core modules web guard_proxy main.py

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ -v --cov=core --cov=modules --cov=web --cov=guard_proxy --cov-report=xml --cov-report=term

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: AI_Security_Scanner/coverage.xml

  lint-and-security:
    name: Static Lint & Security Gate (Flake8 + Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Security_Scanner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Flake8 Fatal Errors Check (Syntax / Undefined Names)
        run: |
          flake8 core modules web guard_proxy main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Bandit High-Severity Security Scan
        run: |
          bandit -r core modules web guard_proxy --severity-level high -f json -o bandit-report.json

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: AI_Security_Scanner/bandit-report.json

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [test, lint-and-security]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: AI_Security_Scanner
          file: AI_Security_Scanner/Dockerfile
          push: false
          tags: ai-security-scanner:ci
