services:
  ai-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_security_scanner
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    ports:
      - "5000:5000"
    environment:
      - WEB_HOST=0.0.0.0
      - GUNICORN_WORKERS=1
      - GUNICORN_THREADS=16
      - SCANNER_TARGET_URL=http://ai-guard-proxy:8000
      - SCANNER_TARGET_MODEL=llama3
      - SCANNER_TIMEOUT=60
      - SCANNER_REQUIRE_AUTH=true
      - SCANNER_STRICT_SECRETS=true
      - SCANNER_JWT_SECRET=${SCANNER_JWT_SECRET:?Set SCANNER_JWT_SECRET in .env or shell}
      - SCANNER_ADMIN_API_KEY=${SCANNER_ADMIN_API_KEY:?Set SCANNER_ADMIN_API_KEY in .env or shell}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - ollama
      - ai-guard-proxy
    networks:
      - scanner-network

  ai-guard-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_guard_proxy
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["python", "-m", "guard_proxy.app"]
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BACKEND=http://ollama:11434
      - ALLOWED_MODELS=llama3-secure,llama3
      - GUARD_API_KEY=${GUARD_API_KEY:-}
      - GUARD_ALLOW_UNAUTHENTICATED_NON_LOOPBACK=1
      - AUDIT_LOG_PATH=/app/logs/guard_audit.jsonl
    volumes:
      - ./logs:/app/logs
    depends_on:
      - ollama
    networks:
      - scanner-network

  ollama:
    image: ollama/ollama:latest
    container_name: ai_scanner_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - scanner-network

networks:
  scanner-network:
    driver: bridge

volumes:
  ollama_models:
    driver: local
