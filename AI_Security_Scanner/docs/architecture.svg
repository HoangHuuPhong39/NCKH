<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 920" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2a4a"/>
      <stop offset="100%" stop-color="#081d33"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e0a45"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cardAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#2e1002"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <style>
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="920" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="30" y="20" width="860" height="44" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="1">AI SECURITY TESTKIT — SYSTEM ARCHITECTURE</text>
  <rect x="740" y="30" width="135" height="24" rx="12" fill="#0369a1"/>
  <text x="807" y="46" class="badge" fill="#e0f2fe" text-anchor="middle">v2.0 ENTERPRISE</text>

  <!-- 1. USER INTERFACES -->
  <rect x="30" y="80" width="860" height="95" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="102" class="layer-title" fill="#38bdf8">1. User Interfaces</text>
  
  <rect x="110" y="115" width="320" height="50" rx="8" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270" y="136" class="card-title" text-anchor="middle">Enterprise Web UI</text>
  <text x="270" y="153" class="card-sub" text-anchor="middle">Port 5000 · Neon Dark Mode · Live SSE Stream</text>

  <rect x="490" y="115" width="320" height="50" rx="8" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="650" y="136" class="card-title" text-anchor="middle">Metasploit-Style CLI</text>
  <text x="650" y="153" class="card-sub" text-anchor="middle">Interactive Command Console · Headless Mode</text>

  <!-- Connectors UI -> Core -->
  <path d="M 270 165 L 270 192 L 460 192 L 460 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 650 165 L 650 192 L 460 192" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- 2. CORE EVALUATION ENGINE -->
  <rect x="30" y="220" width="860" height="185" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="242" class="layer-title" fill="#818cf8">2. Core Evaluation Engine</text>

  <rect x="50" y="255" width="250" height="54" rx="8" fill="url(#cardPurple)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="175" y="277" class="card-title" text-anchor="middle">Threat Model Profiler</text>
  <text x="175" y="296" class="card-sub" text-anchor="middle">OWASP LLM &amp; MITRE ATLAS Profiling</text>

  <rect x="335" y="255" width="250" height="54" rx="8" fill="url(#cardPurple)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="460" y="277" class="card-title" text-anchor="middle">Testcase Loader</text>
  <text x="460" y="296" class="card-sub" text-anchor="middle">Declarative YAML DSL · 62+ VN Benchmarks</text>

  <rect x="620" y="255" width="250" height="54" rx="8" fill="url(#cardPurple)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="745" y="277" class="card-title" text-anchor="middle">Mutation Engine</text>
  <text x="745" y="296" class="card-sub" text-anchor="middle">Adversarial Perturbation &amp; Cipher Bypass</text>

  <!-- Connectors into Adaptive Generator -->
  <path d="M 175 309 L 175 328 L 460 328 L 460 338" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 460 309 L 460 338" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M 745 309 L 745 328 L 460 328" fill="none" stroke="#818cf8" stroke-width="2"/>

  <rect x="250" y="340" width="420" height="52" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="2"/>
  <text x="460" y="362" class="card-title" fill="#f5d0fe" text-anchor="middle">Adaptive Attack Generator</text>
  <text x="460" y="380" class="card-sub" fill="#e9d5ff" text-anchor="middle">Automated Feedback Loop · Dynamic Prompt Evolution</text>

  <!-- Connectors Core -> Targets -->
  <path d="M 460 392 L 460 415 L 175 415 L 175 440" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 460 392 L 460 440" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 460 392 L 460 415 L 745 415 L 745 440" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- 3. TARGET INTERFACES -->
  <rect x="30" y="445" width="860" height="95" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="467" class="layer-title" fill="#4ade80">3. Target Interfaces</text>

  <rect x="50" y="478" width="250" height="50" rx="8" fill="url(#cardGreen)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="175" y="499" class="card-title" text-anchor="middle">Agent Mock Sandbox</text>
  <text x="175" y="516" class="card-sub" text-anchor="middle">Mock SQL, File I/O &amp; RAG Vector Store</text>

  <rect x="335" y="478" width="250" height="50" rx="8" fill="url(#cardGreen)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="460" y="499" class="card-title" text-anchor="middle">Local Ollama Models</text>
  <text x="460" y="516" class="card-sub" text-anchor="middle">Llama 3, Mistral, Qwen, DeepSeek</text>

  <rect x="620" y="478" width="250" height="50" rx="8" fill="url(#cardGreen)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="745" y="499" class="card-title" text-anchor="middle">Cloud API Endpoints</text>
  <text x="745" y="516" class="card-sub" text-anchor="middle">OpenAI-Compatible &amp; Custom HTTP</text>

  <!-- Connectors Targets -> Detection -->
  <path d="M 175 528 L 175 550 L 460 550 L 460 565" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 460 528 L 460 565" fill="none" stroke="#4ade80" stroke-width="2"/>
  <path d="M 745 528 L 745 550 L 460 550" fill="none" stroke="#4ade80" stroke-width="2"/>

  <!-- 4. DETECTION & RISK SCORING -->
  <rect x="30" y="570" width="860" height="175" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="592" class="layer-title" fill="#f59e0b">4. Dual-Stage Detection &amp; Scoring</text>

  <rect x="180" y="602" width="560" height="38" rx="8" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="621" class="card-title" text-anchor="middle">Stage 1: Fast Heuristic Matcher</text>
  <text x="460" y="634" class="card-sub" text-anchor="middle">Sub-millisecond Refusal &amp; Vulnerability Regex Signatures</text>

  <path d="M 460 640 L 460 653" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="180" y="655" width="560" height="38" rx="8" fill="url(#cardAmber)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="674" class="card-title" text-anchor="middle">Stage 2: Deep LLM-as-a-Judge Validator</text>
  <text x="460" y="687" class="card-sub" text-anchor="middle">Semantic Intent Analysis &amp; Jailbreak Confirmation</text>

  <path d="M 460 693 L 460 704" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="180" y="706" width="560" height="32" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="460" y="727" class="card-title" fill="#fef3c7" text-anchor="middle">Quantitative Risk Scorer (ASR · RMR · TAR · Confidence Interval)</text>

  <!-- Connectors Detection -> Storage -->
  <path d="M 460 738 L 460 760 L 175 760 L 175 780" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 460 738 L 460 780" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 460 738 L 460 760 L 745 760 L 745 780" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 5. EVIDENCE & PERSISTENCE -->
  <rect x="30" y="785" width="860" height="105" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="807" class="layer-title" fill="#38bdf8">5. Evidence &amp; Persistence</text>

  <rect x="50" y="820" width="250" height="54" rx="8" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="175" y="842" class="card-title" text-anchor="middle">SQLite Findings DB</text>
  <text x="175" y="861" class="card-sub" text-anchor="middle">Structured Vulnerability Findings</text>

  <rect x="335" y="820" width="250" height="54" rx="8" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="460" y="842" class="card-title" text-anchor="middle">Evidence Store &amp; Replay</text>
  <text x="460" y="861" class="card-sub" text-anchor="middle">Full Prompt/Response Traces &amp; Replay</text>

  <rect x="620" y="820" width="250" height="54" rx="8" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="745" y="842" class="card-title" text-anchor="middle">Multi-Format Reports</text>
  <text x="745" y="861" class="card-sub" text-anchor="middle">Interactive HTML Report &amp; JSON Dumps</text>
</svg>
